controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    custom_controller:
      type: custom_controller/CustomController


custom_controller:
  ros__parameters:

    wheel_names:
      - fake_robot_front_steer_joint
      - fake_robot_rear_steer_joint
      - fake_robot_front_wheel_joint
      - fake_robot_rear_wheel_joint

    wheel_offset: 0.0
    wheel_radius: 0.0725

    cmd_vel_timeout: 0.5

    max_steering_rate: 0.5
    steering_alignment_tolerance: 0.05

    open_loop: true
    position_feedback: false

    enable_odom_tf: true

    odom_frame_id: odom
    base_frame_id: fake_robot_base_link

    tf_frame_prefix_enable: false